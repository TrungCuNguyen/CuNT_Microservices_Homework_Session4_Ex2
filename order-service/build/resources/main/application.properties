server.port=8083
spring.application.name=order-service

# Cấu hình kết nối PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/order_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:17111998}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# External services
services.product.url=http://localhost:8082/api/v1/products

# Khai báo địa chỉ của Eureka Server để đăng ký
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# Hiển thị IP của Service trên Dashboard thay vì hostname (tùy chọn nhưng nên có)
eureka.instance.prefer-ip-address=true
