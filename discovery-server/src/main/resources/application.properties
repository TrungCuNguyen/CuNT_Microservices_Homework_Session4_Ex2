# Cấu hình cổng chạy cho Eureka Server (mặc định chuẩn 8761)
server.port=8761

# Tên ứng dụng
spring.application.name=discovery-server

# Địa chỉ host của Eureka Server
eureka.instance.hostname=localhost

# Không tự đăng ký chính discovery-server vào Eureka registry
eureka.client.register-with-eureka=false

# Không kéo danh sách dịch vụ từ server khác (vì đây là server độc lập)
eureka.client.fetch-registry=false

# Đường dẫn URL của Eureka Server
eureka.client.service-url.defaultZone=http://${eureka.instance.hostname}:${server.port}/eureka/
